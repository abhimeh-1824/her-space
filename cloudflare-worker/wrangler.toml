name = "her-space-scheduler-cron"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Cloudflare Cron Triggers:
# 1. 22:00 IST (16:30 UTC): Curfew window opens
# 2. 22:15 IST (16:45 UTC): First reminder (45 mins left)
# 3. 23:00 IST (17:30 UTC): Second reminder (1 hour left)
# 4. 00:00 IST (18:30 UTC): Midnight cutoff & escalation
[triggers]
crons = ["30 16 * * *", "45 16 * * *", "30 17 * * *", "30 18 * * *"]

[vars]
HOSTELGUARD_API_URL = "https://her-space-pi.vercel.app/api/scheduler/cron"
# Secret CRON_SECRET is configured via: wrangler secret put CRON_SECRET
